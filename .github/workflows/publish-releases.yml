name: Publish versioned GitHub Releases

on:
  push:
    branches: [main]
    paths:
      - 'releases/v*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable version tags and Release pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          shopt -s nullglob
          notes=(releases/v*.md)
          if [[ ${#notes[@]} -eq 0 ]]; then
            echo "No version notes"; exit 0
          fi
          latest=$(printf '%s\n' "${notes[@]}" | sed -E 's#releases/(v[^/]+)\.md#\1#' | sort -V | tail -n 1)
          for file in "${notes[@]}"; do
            tag=$(basename "$file" .md)
            if [[ "$tag" == "v1.5.0" ]]; then
              target="253ed1256f52b1f77a01db29405bb03388d3c2f0"
            else
              target="$GITHUB_SHA"
            fi
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              git tag "$tag" "$target"
              git push origin "refs/tags/$tag"
            fi
            if ! gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
              title="$tag"
              if [[ "$tag" == "v1.5.0" ]]; then title="$tag · Historical stable"; fi
              if [[ "$tag" == "v1.6.0" ]]; then title="$tag · ASR Context & Display V3"; fi
              if [[ "$tag" == "$latest" ]]; then
                gh release create "$tag" --repo "$REPOSITORY" --title "$title" --notes-file "$file" --latest
              else
                gh release create "$tag" --repo "$REPOSITORY" --title "$title" --notes-file "$file" --latest=false
              fi
            fi
          done
